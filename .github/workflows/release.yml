name: Android Release Candidate

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode
        required: true
        default: "1"
      version_name:
        description: Android versionName
        required: true
        default: "0.1.0"

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CERITARIA_SUPABASE_URL: ${{ secrets.CERITARIA_SUPABASE_URL }}
      CERITARIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CERITARIA_SUPABASE_PUBLISHABLE_KEY }}
      CERITARIA_API_BASE_URL: ${{ secrets.CERITARIA_API_BASE_URL }}
      CERITARIA_SIGNING_STORE_PASSWORD: ${{ secrets.CERITARIA_ANDROID_STORE_PASSWORD }}
      CERITARIA_SIGNING_KEY_ALIAS: ${{ secrets.CERITARIA_ANDROID_KEY_ALIAS }}
      CERITARIA_SIGNING_KEY_PASSWORD: ${{ secrets.CERITARIA_ANDROID_KEY_PASSWORD }}
      CERITARIA_VERSION_CODE: ${{ inputs.version_code }}
      CERITARIA_VERSION_NAME: ${{ inputs.version_name }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Enforce Android source guardrails
        run: bash scripts/check-android-source.sh

      - name: Validate release configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CERITARIA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            CERITARIA_SUPABASE_URL
            CERITARIA_SUPABASE_PUBLISHABLE_KEY
            CERITARIA_API_BASE_URL
            CERITARIA_SIGNING_STORE_PASSWORD
            CERITARIA_SIGNING_KEY_ALIAS
            CERITARIA_SIGNING_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing release secret/environment: $name"
              exit 1
            fi
          done
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing CERITARIA_ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          if ! [[ "$CERITARIA_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer"
            exit 1
          fi
          if [ -z "$CERITARIA_VERSION_NAME" ]; then
            echo "::error::version_name must not be empty"
            exit 1
          fi
          case "$CERITARIA_SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::CERITARIA_SUPABASE_URL must use https://"; exit 1 ;;
          esac
          case "$CERITARIA_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::CERITARIA_API_BASE_URL must use https://"; exit 1 ;;
          esac
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ceritaria-release.jks"
          echo "CERITARIA_SIGNING_STORE_FILE=$RUNNER_TEMP/ceritaria-release.jks" >> "$GITHUB_ENV"

      - name: Verify and build signed candidate
        run: gradle lintDebug testDebugUnitTest assembleRelease bundleRelease --stacktrace

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -strict "$AAB"

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs
          sha256sum             apk/release/app-release.apk             bundle/release/app-release.aab             > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: ceritaria-studio-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
